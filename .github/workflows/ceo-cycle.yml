name: CEO agent cycle

on:
  schedule:
    # Daily 14:00 UTC (~9am Chicago)
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish next queued post (AF_CEO_PUBLISH=1)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: af-agent-git-main
  cancel-in-progress: false

jobs:
  ceo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run CEO cycle
        env:
          AF_ZERO_COST: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AF_PRIMARY_URL: https://authorityforge-tau.vercel.app
          AF_CEO_PUBLISH: ${{ inputs.publish == true && '1' || '0' }}
          SITE_URL: https://authorityforge-tau.vercel.app
        run: node scripts/ceo-run.mjs

      - name: IndexNow ping (non-fatal)
        env:
          SITE_URL: https://authorityforge-tau.vercel.app
        run: node scripts/indexnow-ping.mjs --recent 5 || true

      - name: Commit agent state / queue / logs
        run: |
          set -euo pipefail
          git config user.name "af-ceo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents/ content/queue.json content/posts/ blog/ sitemap.xml llms.txt || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "agent(ceo): daily cycle $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push race attempt $i — retry"
            sleep $((i * 2))
          done
          echo "Failed to push after retries" >&2
          exit 1
