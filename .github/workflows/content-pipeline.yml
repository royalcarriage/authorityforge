name: Content pipeline

on:
  schedule:
    # Tuesdays + Fridays 15:00 UTC
    - cron: "0 15 * * 2,5"
  workflow_dispatch:
    inputs:
      use_free_llm:
        description: "Use free LLM (Gemini free / template). Never paid OpenAI."
        type: boolean
        default: true
      dry_run:
        description: "Build only; do not publish next queue item"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publish next queued post (zero-cost)
        if: ${{ inputs.dry_run != true }}
        env:
          AF_ZERO_COST: "1"
          AF_USE_LLM: ${{ inputs.use_free_llm != false && '1' || '0' }}
          AF_LLM_PROVIDER: auto
          # Free-tier Gemini only — do NOT set OPENAI_API_KEY here
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: https://authorityforge-tau.vercel.app
          BASE_PATH: ""
        run: node scripts/publish-next.mjs

      - name: Build blog + sitemap
        env:
          SITE_URL: https://authorityforge-tau.vercel.app
          BASE_PATH: ""
        run: |
          node scripts/build-blog.mjs
          node scripts/build-sitemap.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "authorityforge-pipeline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ blog/ sitemap.xml llms.txt
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "content(pipeline): free-LLM publish + rebuild $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
