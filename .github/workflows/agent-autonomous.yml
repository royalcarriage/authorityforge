name: Autonomous agent (zero-cost)

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Serialize with CEO so both can push agent state without racing
concurrency:
  group: af-agent-git-main
  cancel-in-progress: false

jobs:
  autonomous:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Full-radius autonomous cycle
        env:
          AF_ZERO_COST: "1"
          AF_CEO_PUBLISH: "1"
          AF_USE_LLM: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AF_PRIMARY_URL: https://authorityforge-tau.vercel.app
          SITE_URL: https://authorityforge-tau.vercel.app
          BASE_PATH: ""
        run: node scripts/agent-autonomous.mjs
      - name: IndexNow ping (non-fatal)
        env:
          SITE_URL: https://authorityforge-tau.vercel.app
        run: node scripts/indexnow-ping.mjs --recent 5 || true
      - name: Commit agent state + content
        run: |
          set -euo pipefail
          git config user.name "af-autonomous-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents/ content/ blog/ sitemap.xml llms.txt || true
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "agent(full-radius): cycle $(date -u +%Y-%m-%dT%H:%MZ)"
          # Survive concurrent main updates (CEO / user store / other jobs)
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push race attempt $i — retry"
            sleep $((i * 2))
          done
          echo "Failed to push after retries" >&2
          exit 1
